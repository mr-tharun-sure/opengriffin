name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pip install uv
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q

  installer-macos:
    # The Linux installer path is covered by the Docker smoke test in the
    # `test` job; macOS runners have no Docker, so exercise install.sh
    # natively against this checkout instead.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run installer against this checkout
        run: |
          export OPENGRIFFIN_REPO_URL="$PWD"
          export OPENGRIFFIN_REF="$(git rev-parse HEAD)"
          export OPENGRIFFIN_HOME="$RUNNER_TEMP/opengriffin"
          bash scripts/install.sh
          test -x "$OPENGRIFFIN_HOME/.venv/bin/opengriffin"
          test -f "$OPENGRIFFIN_HOME/.env"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
