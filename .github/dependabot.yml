version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # eslint majors break eslint-config-next's bundled plugins (eslint 10
      # removed context.getFilename); unpin once eslint-config-next supports it.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
